<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - WhoKnows</title>
</head>
<body>
<main>
    <h1>Register</h1>

    {{ if .error }}
    <p role="alert">{{ .error }}</p>
    {{ end }}

    <form action="/api/register" method="POST">
        <div>
            <label for="username">Username</label>
            <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
            >
        </div>

        <div>
            <label for="email">Email</label>
            <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
            >
        </div>

        <div>
            <label for="password">Password</label>
            <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    required
            >
        </div>

        <button type="submit">Register</button>
    </form>
</main>
</body>
</html>
