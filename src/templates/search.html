<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search - WhoKnows</title>
</head>
<body>
    <main>
        <h1>Search</h1>

        {{ if .error }}
        <p role="alert">{{ .error }}</p>
        {{ end }}

        <form action="/" method="GET">
            <label for="q">Search query</label>
            <input id="q" name="q" type="text">

            <button type="submit">Search</button>
        </form>
    </main>
</body>
</html>
