name: Migrate DB

on:
  workflow_dispatch:
  push:
    branches: [DB-prod]

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./migrations
          push: true
          tags: ghcr.io/visionjamx/whoknows-migrations:latest

      - name: Trigger Coolify migration run
        run: |
          curl --fail -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_MIGRATIONS_WEBHOOK }}"
