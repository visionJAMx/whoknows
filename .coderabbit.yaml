# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
tone_instructions: "Give brief and precise feedback, focusing on anti-patterns and potential bugs"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "dev"

  path_instructions:
    - path: "src/**/*.go"
      instructions: |
        focus on error-handling, minimization of technical-debt, security and idiomatic Go.

    - path: "src/repositories/**"
      instructions: |
        Focus on security and perfomance

    - path: ".github/**"
      instructions: |
        Focus on security, perfomance and caching

chat:
  auto_reply: true