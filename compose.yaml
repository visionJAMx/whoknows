services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-whoknows}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  whoknows_app:
    image: ghcr.io/visionjamx/whoknows:latest
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-whoknows}?sslmode=disable
      - GIN_MODE=${GIN_MODE}

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-whoknows_postgres_data}
